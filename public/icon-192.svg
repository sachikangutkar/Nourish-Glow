<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <radialGradient id="flower" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#bg)"/>
  <!-- Petals -->
  <ellipse cx="96" cy="52" rx="18" ry="32" fill="url(#flower)" opacity="0.9"/>
  <ellipse cx="96" cy="140" rx="18" ry="32" fill="url(#flower)" opacity="0.9"/>
  <ellipse cx="52" cy="96" rx="32" ry="18" fill="url(#flower)" opacity="0.9"/>
  <ellipse cx="140" cy="96" rx="32" ry="18" fill="url(#flower)" opacity="0.9"/>
  <!-- Diagonal petals -->
  <ellipse cx="68" cy="68" rx="14" ry="28" fill="#fb7185" opacity="0.8" transform="rotate(-45 68 68)"/>
  <ellipse cx="124" cy="68" rx="14" ry="28" fill="#fb7185" opacity="0.8" transform="rotate(45 124 68)"/>
  <ellipse cx="68" cy="124" rx="14" ry="28" fill="#fb7185" opacity="0.8" transform="rotate(45 68 124)"/>
  <ellipse cx="124" cy="124" rx="14" ry="28" fill="#fb7185" opacity="0.8" transform="rotate(-45 124 124)"/>
  <!-- Center -->
  <circle cx="96" cy="96" r="24" fill="#fff" opacity="0.95"/>
  <circle cx="96" cy="96" r="16" fill="#f43f5e"/>
  <!-- Sparkle dots -->
  <circle cx="96" cy="84" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="104" cy="100" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="89" cy="100" r="2.5" fill="#fff" opacity="0.8"/>
</svg>
