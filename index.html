    <script>
      (function() {
        // Intercept TensorFlow Lite / MediaPipe Wasm diagnostic messages routed to stderr/console.error
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args[0];
          if (
            typeof msg === 'string' &&
            (msg.includes('INFO: Created TensorFlow Lite') ||
             msg.includes('XNNPACK delegate') ||
             msg.startsWith('INFO:'))
          ) {
            console.info(...args);
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
